<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" fill="none">
<defs>
 <radialGradient id="bg" cx="50%" cy="40%"><stop stop-color="#24120f"/><stop offset=".6" stop-color="#0b0d0f"/><stop offset="1" stop-color="#040506"/></radialGradient>
 <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b2a1b"/><stop offset=".55" stop-color="#24110f"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#35201a"/><stop offset=".55" stop-color="#120c0b"/><stop offset="1" stop-color="#07090a"/></linearGradient>
 <radialGradient id="fire"><stop stop-color="#f2bd62" stop-opacity=".85"/><stop offset=".4" stop-color="#b65c24" stop-opacity=".22"/><stop offset="1" stop-color="#6c2515" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
</defs>
<rect width="1800" height="900" fill="url(#bg)"/>
<circle cx="350" cy="260" r="180" fill="url(#fire)" filter="url(#soft)"/><circle cx="1450" cy="250" r="180" fill="url(#fire)" filter="url(#soft)"/>
<!-- wings -->
<path d="M805 350 C650 245 485 180 300 165 C410 235 470 325 505 418 C595 365 690 345 805 376 Z" fill="url(#wing)" stroke="#774229" stroke-width="7"/>
<path d="M995 350 C1150 245 1315 180 1500 165 C1390 235 1330 325 1295 418 C1205 365 1110 345 995 376 Z" fill="url(#wing)" stroke="#774229" stroke-width="7"/>
<!-- wing bones -->
<g stroke="#875039" stroke-width="6" opacity=".75"><path d="M785 345 L540 220"/><path d="M740 356 L520 300"/><path d="M1015 345 L1260 220"/><path d="M1060 356 L1280 300"/></g>
<!-- body -->
<path d="M785 355 C730 405 705 505 760 610 C820 705 980 705 1040 610 C1095 505 1070 405 1015 355 C965 320 835 320 785 355 Z" fill="url(#body)" stroke="#874f35" stroke-width="8"/>
<!-- head -->
<path d="M820 260 L900 190 980 260 1020 345 965 410 H835 L780 345 Z" fill="#0b0a0b" stroke="#925a3c" stroke-width="8"/>
<!-- horns -->
<path d="M845 245 C810 190 790 140 820 105 C850 148 875 182 900 205" fill="#0a0a0b" stroke="#9b6a46" stroke-width="7"/>
<path d="M955 205 C980 182 1005 148 1035 105 C1065 140 1045 190 1010 245" fill="#0a0a0b" stroke="#9b6a46" stroke-width="7"/>
<!-- eyes -->
<path d="M825 292 Q852 274 882 292 Q855 315 828 304 Z" fill="#f0c768"/><path d="M918 292 Q948 274 975 292 Q972 315 945 304 Z" fill="#f0c768"/>
<!-- teeth/jaw -->
<path d="M820 350 Q900 402 980 350 Q956 420 900 428 Q844 420 820 350 Z" fill="#1a100e" stroke="#875039" stroke-width="6"/>
<g fill="#ead6b2"><path d="M848 364 l10 32 10-38 Z"/><path d="M875 374 l10 34 10-40 Z"/><path d="M900 378 l10 34 10-40 Z"/><path d="M925 374 l10 34 10-40 Z"/></g>
<!-- tail -->
<path d="M790 565 C650 655 520 710 380 675 C500 760 670 765 820 650" stroke="#6f3a28" stroke-width="34" stroke-linecap="round"/>
<!-- chest ember -->
<path d="M900 452 C855 500 850 560 900 595 C950 560 945 500 900 452 Z" fill="#7b2e18" stroke="#9e5d32" stroke-width="5" opacity=".8"/>
<circle cx="900" cy="520" r="78" fill="url(#fire)" opacity=".7"/>
<!-- smoke curls -->
<g stroke="#665f59" stroke-opacity=".12" stroke-width="22" fill="none">
 <path d="M300 700 C180 620 180 500 300 450 C420 400 430 320 350 250"/>
 <path d="M1500 710 C1620 630 1620 500 1500 450 C1380 400 1370 320 1450 250"/>
</g>
<rect width="1800" height="900" filter="url(#noise)"/>
</svg>

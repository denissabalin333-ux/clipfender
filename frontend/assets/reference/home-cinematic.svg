<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" fill="none">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#04080b"/><stop offset=".58" stop-color="#0a1013"/><stop offset="1" stop-color="#050607"/></linearGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3b3a35"/><stop offset=".68" stop-color="#181a1a"/><stop offset="1" stop-color="#0a0c0d"/></linearGradient>
 <linearGradient id="stone2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#514b41"/><stop offset="1" stop-color="#121517"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#efe1b3" stop-opacity=".78"/><stop offset=".32" stop-color="#d5b77b" stop-opacity=".20"/><stop offset="1" stop-color="#c39b5c" stop-opacity="0"/></radialGradient>
 <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5c86d"/><stop offset="1" stop-color="#9d662b"/></linearGradient>
 <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1800" height="900" fill="url(#sky)"/>
<!-- distant mountains -->
<path d="M0 450 L150 350 260 420 400 300 520 410 650 330 790 430 900 335 1040 420 1160 300 1290 410 1440 290 1600 400 1720 340 1800 410 V610 H0 Z" fill="#0a1012"/>

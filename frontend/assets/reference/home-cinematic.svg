<g opacity=".42" stroke="#1b2326" stroke-width="16" stroke-linecap="round">
 <path d="M110 710 L180 175 M220 710 L275 220 M335 710 L390 165 M450 710 L495 245"/>
 <path d="M120 530 L185 530 M225 480 L290 480 M340 505 L402 505 M456 470 L520 470"/>
</g>

 <path d="M1117 333 L1130 320 1143 333 V375 H1117 Z"/><path d="M1240 372 L1253 359 1266 372 V414 H1240 Z"/><path d="M1319 303 L1331 291 1343 303 V346 H1319 Z"/>
</g>

<!doctype html><html lang="ru" data-cf-final="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Просмотр материала — CLIPFENDER</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css?v=71.0"><link rel="stylesheet" href="/static/css/stage9-editor-tools.css?v=90.0">
  {% include "components/seo.html" %}
</head><body class="video-page"><main class="cf-new-page"><div class="cf-new-shell"><a class="cf-new-kicker" href="/archive">НАЗАД К АРХИВУ</a><h1 id="videoTitle">ПРОСМОТР МАТЕРИАЛА</h1><div class="cf-video-layout"><section class="cf-video-panel"><div id="videoMount" style="width:100%;aspect-ratio:16/9;background:#050607;border:1px solid rgba(200,155,60,.34);display:grid;place-items:center;color:#6E675B">Загрузка материала…</div></section><aside class="cf-video-meta"><span class="cf-new-kicker">МЕТАДАННЫЕ</span><h3 id="videoMetaTitle" style="font-family:Cinzel,serif;color:#E0B86A">Подготовка данных</h3><p id="videoMetaBody" style="color:#A79E8C;line-height:1.8">Страница использует существующий endpoint /api/video/{id}. Если ID отсутствует, вернитесь в архив.</p><a class="btn" id="youtubeLink" href="/archive">ОТКРЫТЬ АРХИВ</a><p class="video-source" id="videoSourceAttribution"><a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">Источник: YouTube</a></p>
<div class="cf-report-panel" data-cf-report-panel hidden>
  <button class="btn btn-secondary" type="button" data-cf-report-open data-i18n="report.open">ПОЖАЛОВАТЬСЯ</button>
  <form data-cf-report-form hidden>
    <label><span data-i18n="report.reason">Причина</span><select name="reason" required><option value="copyright">Авторские права</option><option value="wrong_content">Неверный материал</option><option value="broken">Сломанный источник</option><option value="duplicate">Дубликат</option><option value="other">Другое</option></select></label>
    <label><span data-i18n="report.details">Комментарий</span><textarea name="details" maxlength="1200" rows="4"></textarea></label>
    <div class="cf-report-actions"><button class="btn" type="submit" data-i18n="report.submit">ОТПРАВИТЬ</button><button class="btn btn-secondary" type="button" data-cf-report-cancel data-i18n="common.cancel">ОТМЕНА</button></div>
    <p data-cf-report-status role="status" aria-live="polite"></p>
  </form>
</div></aside></div></div></main><script>(()=>{const id=new URLSearchParams(location.search).get('id');const mount=document.getElementById('videoMount');if(!id){mount.textContent='ID материала не указан';return;}fetch('/api/video/'+encodeURIComponent(id)).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{const video=d.video||d;const url=video.url||video.youtube_url||video.video_url||video.watch_url;document.getElementById('videoMetaTitle').textContent=video.title||'Материал найден';document.getElementById('videoMetaBody').textContent=video.description||'Доступны данные исходного материала.';if(url){const iframe=document.createElement('iframe');iframe.src=url.replace('watch?v=','embed/').split('&')[0];iframe.allow='autoplay; encrypted-media; picture-in-picture';iframe.allowFullscreen=true;iframe.style='width:100%;height:100%;border:0';mount.textContent='';mount.appendChild(iframe);document.getElementById('youtubeLink').href=url;}else{mount.textContent='Исходное видео доступно по данным API.'}}).catch(()=>{mount.textContent='Не удалось загрузить материал. Вернитесь в архив и повторите попытку.'})})();</script>

<script src="/static/js/stage5-atmosphere.js?v=80.0" defer></script><script src="/static/js/stage7-privacy.js?v=1.0"></script>
</body></html>

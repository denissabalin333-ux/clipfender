<header class="cf2-header" data-cf2-header>
  <div class="cf2-header__rail" aria-hidden="true"></div>
  <div class="cf2-header__inner">
    <a class="cf2-brand" href="/" data-cf-hard-nav aria-label="ClipFender — на главную">
      <span class="cf2-brand__crest" aria-hidden="true"><img src="/static/assets/reference/cf-crest.svg" alt="" aria-hidden="true"></span>
      <span class="cf2-brand__wordmark"><img src="/static/assets/reference/cf-wordmark.svg" alt="CLIPFENDER"></span>
    </a>

    <div class="cf2-header__actions">
      <nav class="cf2-nav" id="navLinks" aria-label="Основная навигация">
        <a data-route="/" href="/" data-cf-hard-nav data-i18n="nav.home">ГЛАВНАЯ</a>
        <a data-route="/search" href="/search" data-cf-hard-nav data-i18n="nav.searchCharacter">НАЙТИ РОЛИК</a>
        <a data-route="/characters" href="/characters" data-cf-hard-nav data-i18n="nav.characters">ПЕРСОНАЖИ</a>
        <a data-route="/edit-ideas" href="/edit-ideas" data-cf-hard-nav data-i18n="nav.ideas">ИДЕИ ДЛЯ ЭДИТОВ</a>
        <a data-route="/guides" href="/guides" data-cf-hard-nav data-i18n="nav.guides">ГАЙДЫ</a>
        <a data-route="/help" href="/help" data-cf-hard-nav data-i18n="nav.help">ПОМОЩЬ</a>
        <a data-route="/project" href="/project" data-cf-hard-nav data-i18n="nav.project">О ПРОЕКТЕ</a>
        <a data-route="/library" href="/library" data-cf-hard-nav data-i18n="nav.library">БИБЛИОТЕКА</a>
        <span class="cf2-nav__rule" aria-hidden="true"></span>
        <button type="button" class="cf-i18n-toggle" data-cf-language-toggle data-i18n-aria="language.toggle" aria-label="Переключить язык"><span data-cf-language-label>EN</span></button>
        <a
          class="cf2-nav__login"
          data-cf-auth-login
          data-route="/login"
          href="/login"
          data-cf-hard-nav
          data-i18n="nav.login"
        >ВОЙТИ</a>

        <div class="cf18-account" data-cf-account hidden>
          <button
            class="cf18-account__toggle"
            type="button"
            data-cf-account-toggle
            aria-expanded="false"
            aria-haspopup="true"
          >
            <span class="cf18-account__crest" aria-hidden="true">◈</span>
            <span class="cf18-account__copy">
              <strong data-cf-account-name>ПРОФИЛЬ</strong>
              <small data-cf-account-email></small>
            </span>
            <span class="cf18-account__chevron" aria-hidden="true">⌄</span>
          </button>

          <div class="cf18-account__menu" data-cf-account-menu hidden>
            <a href="/library" data-cf-hard-nav>
              <span>БИБЛИОТЕКА</span>
              <small>Избранное и коллекции</small>
            </a>
            <button type="button" data-cf-account-logout>
              <span>ВЫЙТИ</span>
              <small>Завершить сессию</small>
            </button>
          </div>
        </div>
      </nav>

      <button class="cf2-mobile-toggle mobile-menu-btn" type="button" onclick="toggleMobileMenu()" aria-label="Открыть меню" aria-expanded="false" aria-controls="navLinks">
        <span class="cf2-mobile-toggle__bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
    </div>
  </div>
  <div class="cf2-mobile-backdrop" data-mobile-backdrop aria-hidden="true"></div>

<style id="cf18-account-style">
.cf18-account[hidden],
.cf2-nav__login[hidden]{
  display:none!important;
}

.cf18-account{position:relative;display:inline-flex;align-items:center;margin-left:2px}
.cf18-account__toggle{
  min-height:36px;
  max-width:240px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:5px 10px;
  border:1px solid rgba(200,155,60,.40);
  background:linear-gradient(180deg,#171512,#0b0d0e);
  color:#ead6ae;
  cursor:pointer;
  font:500 9px/1 'Montserrat',Inter,sans-serif;
  letter-spacing:.08em;
  text-align:left;
}
.cf18-account__toggle:hover{
  border-color:rgba(224,182,106,.62);
  box-shadow:0 0 18px rgba(200,155,60,.10);
}
.cf18-account__crest{
  width:24px;
  height:28px;
  flex:0 0 24px;
  display:grid;
  place-items:center;
  border:1px solid rgba(224,182,106,.36);
  color:#d8b36b;
  font-size:11px;
}
.cf18-account__copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.cf18-account__copy strong{
  color:#e5c88f;
  font:600 9px/1 'Montserrat',Inter,sans-serif;
  letter-spacing:.08em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cf18-account__copy small{
  color:#746c63;
  font:400 7px/1 'Montserrat',Inter,sans-serif;
  letter-spacing:.02em;
  max-width:120px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cf18-account__chevron{
  color:#a88752;
  font-size:13px;
  margin-left:1px;
}
.cf18-account__menu{
  position:absolute;
  top:calc(100% + 7px);
  right:0;
  z-index:10040;
  width:220px;
  padding:6px;
  border:1px solid rgba(200,155,60,.32);
  background:linear-gradient(180deg,#12171a,#090c0f);
  box-shadow:0 20px 50px rgba(0,0,0,.52);
}
.cf18-account__menu a,
.cf18-account__menu button{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:4px;
  padding:11px 12px;
  border:0;
  border-bottom:1px solid rgba(200,155,60,.10);
  background:transparent;
  color:#dfc89d;
  text-decoration:none;
  cursor:pointer;
  font:600 9px/1.1 'Montserrat',Inter,sans-serif;
  letter-spacing:.10em;
  text-align:left;
}
.cf18-account__menu button:last-child,
.cf18-account__menu a:last-child{border-bottom:0}
.cf18-account__menu a:hover,
.cf18-account__menu button:hover{
  background:rgba(200,155,60,.07);
  color:#f0d9ac;
}
.cf18-account__menu small{
  color:#746c63;
  font:400 7px/1.25 'Montserrat',Inter,sans-serif;
  letter-spacing:.02em;
}
.cf18-account__menu button:last-child span{
  color:#d58f81;
}
@media(max-width:760px){
  .cf18-account{
    width:100%;
    margin-left:0;
    padding-top:6px;
  }
  .cf18-account__toggle{
    width:100%;
    max-width:none;
    justify-content:flex-start;
  }
  .cf18-account__menu{
    position:relative;
    top:auto;
    right:auto;
    width:100%;
    margin-top:6px;
  }
}
</style>

</header>

<script src="/static/js/stage11-i18n.js?v=110.0" defer></script>
<script src="/static/js/stage18-account.js?v=180.0" defer></script>

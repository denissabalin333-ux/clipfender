services:
  clipfender:
    build: .
    container_name: clipfender
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-ClipFender Admin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHARACTER_IMAGE_SEARCH_ENABLED: ${CHARACTER_IMAGE_SEARCH_ENABLED:-0}
      CHARACTER_IMAGE_GENERATION_ENABLED: ${CHARACTER_IMAGE_GENERATION_ENABLED:-1}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1024x1536}
      CHARACTER_STORAGE_DIR: /app/data/characters
      CHARACTER_IMAGE_MIN_SHORT_SIDE: ${CHARACTER_IMAGE_MIN_SHORT_SIDE:-900}
      CHARACTER_IMAGE_MAX_BYTES: ${CHARACTER_IMAGE_MAX_BYTES:-12000000}
      CHARACTER_IMAGE_MIN_EDGE_SCORE: ${CHARACTER_IMAGE_MIN_EDGE_SCORE:-7}
      CHARACTER_DISCOVERY_RATE_LIMIT: ${CHARACTER_DISCOVERY_RATE_LIMIT:-3}
      CHARACTER_DISCOVERY_RATE_WINDOW: ${CHARACTER_DISCOVERY_RATE_WINDOW:-86400}
      CHARACTER_GENERATION_DAILY_GUARD: ${CHARACTER_GENERATION_DAILY_GUARD:-10}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
      PLAUSIBLE_SCRIPT_URL: ${PLAUSIBLE_SCRIPT_URL:-https://plausible.io/js/script.js}
      SEARCH_DAILY_GUARD: ${SEARCH_DAILY_GUARD:-70}
      SEARCH_REQUEST_MIN_INTERVAL: ${SEARCH_REQUEST_MIN_INTERVAL:-0.35}
      SEARCH_RATE_LIMIT: ${SEARCH_RATE_LIMIT:-30}
      SEARCH_RATE_WINDOW: ${SEARCH_RATE_WINDOW:-60}
      CONTACT_SMTP_HOST: ${CONTACT_SMTP_HOST:-}
      CONTACT_SMTP_PORT: ${CONTACT_SMTP_PORT:-587}
      CONTACT_SMTP_USER: ${CONTACT_SMTP_USER:-}
      CONTACT_SMTP_PASSWORD: ${CONTACT_SMTP_PASSWORD:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_SMTP_TLS: ${CONTACT_SMTP_TLS:-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CLIPFINDER_DB_PATH: /app/data/clipfinder.db
    volumes:
      - clipfender_data:/app/data
    restart: unless-stopped

volumes:
  clipfender_data:
